<html>
<head>
    <title>Colorado</title>
</head>

<body style="margin:0;">

    <!-- Div tổng -->
    <div style="width:100%; height:100vh;">

        <!-- Banner -->
        <div style="height:120px; border-bottom:1px solid black;">
            <iframe src="logo.html"
                    width="100%"
                    height="100%"
                    frameborder="0">
            </iframe>
        </div>

        <!-- Phần dưới -->
        <div style="display:flex; height:calc(100vh - 120px);">

            <!-- Menu -->
            <div style="width:180px; border-right:1px solid black;">
                <iframe src="link.html"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        name="menuFrame">
                </iframe>
            </div>

            <!-- Nội dung -->
            <div style="flex:1;">
                <iframe src="homepage.html"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        name="mainFrame">
                </iframe>
            </div>

        </div>

    </div>

</body>
</html>
