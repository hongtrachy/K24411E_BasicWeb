<html>
<head>
    <meta charset='utf-8'>
    <title>Math Function</title>
    <style>
        table{
            width:500px;
            margin:auto;
            border-collapse:collapse;
        }
        td{
            border:1px solid black;
            padding:10px;
        }
        input{
            width:100%;
        }
        h2{
            text-align:center;
        }
    </style>
</head>
    <body>
    <h2>Math Function</h2>
        <table>
            <tr>
                <td>a:</td>
                <td><input type="text" id="a"></td>
            </tr>

            <tr>
                <td>b:</td>
                <td><input type="text" id="b"></td>
            </tr>

            <tr>
                <td>c:</td>
                <td><input type="text" id="c"></td>
            </tr>

            <tr>
                <td>Result:</td>
                <td><input type="text" id="result"></td>
            </tr>

            <tr>
                <td colspan="2">
                    <button onclick="max()">MAX</button>
                    <button onclick="min()">MIN</button>
                    <button onclick="sin()">sin(a)</button>
                    <button onclick="cos()">cos(a)</button>
                    <button onclick="pow()">a^b</button>
                </td>
            </tr>
        </table>
        <script>

            function max()
            {
                var a = parseInt(document.getElementById("a").value);
                var b = parseInt(document.getElementById("b").value);
                var c = parseInt(document.getElementById("c").value);

                document.getElementById("result").value = Math.max(a,b,c);
            }

            function min()
            {
                var a = parseInt(document.getElementById("a").value);
                var b = parseInt(document.getElementById("b").value);
                var c = parseInt(document.getElementById("c").value);

                document.getElementById("result").value = Math.min(a,b,c);
            }

            function sin()
            {
                var a = parseInt(document.getElementById("a").value);

                document.getElementById("result").value = Math.sin(a);
            }

            function cos()
            {
                var a = parseInt(document.getElementById("a").value);

                document.getElementById("result").value = Math.cos(a);
            }

            function pow()
            {
                var a = parseInt(document.getElementById("a").value);
                var b = parseInt(document.getElementById("b").value);

                document.getElementById("result").value = Math.pow(a,b);
            }

        </script>

    </body>
</html>
