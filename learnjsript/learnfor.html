<html>
    <head>
        <meta charset='utf-8'>
        <title>Tiêu đề trang</title>
    </head>
    <body>
        <h3 id="mylist"> </h3>
        <p id="myparagraph">TEST 0</p>

    <script type="text/javascript">
        var myList = document.getElementById("mylist");
        var myParagraph = document.getElementById("myparagraph");
        var arr = [];

        for (var i = 1; i <= 100; i++) {
            arr.push("Dòng " + i);
        }

        alert("Bắt đầu vòng lặp");
        alert(myList);

        for (var i = 0; i < arr.length; i++) {
            myList.innerHTML += arr[i] + "<br/>";
        }

        myParagraph.innerText = "Đã hiển thị " + arr.length + " phần tử.";
    </script>
    
    </body>
</html>
